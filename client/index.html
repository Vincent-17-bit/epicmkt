<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var mode = "system";
        try {
          var stored = localStorage.getItem("epicmkt-theme");
          if (stored === "light" || stored === "dark" || stored === "system") mode = stored;
        } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#111111" : "#FFFFFF");
      })();
    </script>
    <meta name="description" content="Find barbershops, water refill points, chemists, agrovets, gyms and more near you in Kenya. Call, WhatsApp or get directions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="EpicMKT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EpicMKT: Find local businesses in Kenya" />
    <meta property="og:description" content="Find barbershops, water refill points, chemists, agrovets, gyms and more near you in Kenya. Call, WhatsApp or get directions." />
    <meta property="og:image" content="__SITE_URL__/icon-512.png" />
    <meta property="og:locale" content="en_KE" />
    <meta name="twitter:card" content="summary" />
    <title>EpicMKT: Find local businesses in Kenya</title>
  </head>

    <div id="root"></div>
    <noscript>EpicMKT needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
