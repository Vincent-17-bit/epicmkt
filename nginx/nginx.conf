user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;
    types_hash_max_size 2048;

    log_format main escape=json '{"t":"$time_iso8601","ip":"$remote_addr","host":"$host","req":"$request","status":$status,"bytes":$body_bytes_sent,"rt":"$request_time","ut":"$upstream_response_time","cache":"$upstream_cache_status","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/manifest+json image/svg+xml font/ttf font/otf;

    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=200m inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:20m max_size=300m inactive=1h use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=2g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:50m max_size=10g inactive=30d use_temp_path=off;

    include /etc/nginx/limits.conf;
    include /etc/nginx/conf.d/*.conf;
}
