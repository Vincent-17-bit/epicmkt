limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

limit_req_zone $binary_remote_addr zone=rl_page:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=rl_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rl_static:10m rate=150r/s;
limit_req_zone $binary_remote_addr zone=rl_admin:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rl_media:20m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=cn_ip:10m;

map $request_uri $deny_path {
    default 0;
    ~*/\.(?!well-known) 1;
    ~*\.(php|asp|aspx|jsp|cgi|env|bak|sql)(\?|$) 1;
    ~*^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|cgi-bin|actuator) 1;
}

map $http_user_agent $deny_agent {
    default 0;
    ~*(sqlmap|nikto|masscan|zgrab|nuclei|dirbuster|gobuster|wpscan|acunetix|havij) 1;
}
