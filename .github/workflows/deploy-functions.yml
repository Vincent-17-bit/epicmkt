# Deploys Supabase edge functions on demand (Actions → "Deploy edge functions" → Run workflow).
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (a personal access token from supabase.com/dashboard/account/tokens)
# and SUPABASE_PROJECT_REF (the project's reference id). Each function keeps its verify_jwt setting from supabase/config.toml.
# The default list is the media set: photos, videos, the 3D model, the poster and the photo spin.
name: Deploy edge functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Function names, separated by spaces"
        required: true
        default: "seller-media-sign seller-media-finalize seller-media-ticket seller-media3d-finalize seller-media-purge seller-item-copy-media media-gc"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${PROJECT_REF}" ]; then
            echo "Set the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets first." >&2
            exit 1
          fi
          for name in ${FUNCTIONS}; do
            if ! [[ "${name}" =~ ^[a-z0-9-]+$ ]] || [ ! -d "supabase/functions/${name}" ]; then
              echo "Unknown function: ${name}" >&2
              exit 1
            fi
            echo "Deploying ${name}"
            supabase functions deploy "${name}" --project-ref "${PROJECT_REF}"
          done
